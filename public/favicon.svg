<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="cross" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- Base Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#2dd4bf" stroke-width="6" stroke-opacity="0.3" stroke-dasharray="16 12" />
  
  <!-- Central Emblem Shield -->
  <rect x="136" y="136" width="240" height="240" rx="48" fill="#134e4a" filter="url(#shadow)" stroke="#14b8a6" stroke-width="4" />
  
  <!-- Medical Plus / Rx Emblem -->
  <!-- Vertical Bar -->
  <rect x="232" y="176" width="48" height="160" rx="14" fill="#ffffff" />
  <!-- Horizontal Bar -->
  <rect x="176" y="232" width="160" height="48" rx="14" fill="#ffffff" />
  
  <!-- Heartbeat Pulse Line across center -->
  <path d="M 160 256 L 210 256 L 230 206 L 256 306 L 280 220 L 298 270 L 312 256 L 352 256" 
        fill="none" 
        stroke="#0d9488" 
        stroke-width="8" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Mountain / Hill icon hinting at Himachal & Rajasthan terrain at bottom -->
  <path d="M 166 330 L 206 295 L 236 320 L 286 280 L 346 330 Z" fill="#0f766e" opacity="0.9" />

  <!-- Text / Subtitle badge -->
  <circle cx="256" cy="116" r="16" fill="#f59e0b" />
  <circle cx="256" cy="396" r="12" fill="#2dd4bf" />
</svg>
